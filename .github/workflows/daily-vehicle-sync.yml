name: Daily Vehicle Data Sync

on:
  schedule:
    # 09:20 KST every day.
    - cron: '20 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-vehicle-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: CarCompareLab/frontend/package-lock.json

      - name: Install dependencies
        working-directory: CarCompareLab/frontend
        run: npm ci

      - name: Sync Danawa vehicle list
        working-directory: CarCompareLab/frontend
        run: npm run data:vehicles:sync

      - name: Check data changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- CarCompareLab/frontend/src/data/mockVehicles.ts; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new vehicles found."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Vehicle data changed."
          fi

      - name: Build
        if: steps.changes.outputs.changed == 'true'
        working-directory: CarCompareLab/frontend
        env:
          VITE_BASE_PATH: /Coding/
        run: npm run build

      - name: Commit synced vehicle data
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CarCompareLab/frontend/src/data/mockVehicles.ts
          git commit -m "Sync new vehicle data"

      - name: Push data update
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git push origin HEAD:master
          git push origin HEAD:main

      - name: Setup Pages
        if: steps.changes.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: CarCompareLab/frontend/dist

      - name: Deploy to GitHub Pages
        if: steps.changes.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
